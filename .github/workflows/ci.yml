name: ci

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install lint tools
        run: pip install ruff==0.15.8 black==26.3.1
      - name: ruff
        run: ruff check --no-fix .
      - name: black
        run: black --check --target-version py313 hacienda_gpt tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest==9.0.3 pytest-mock==3.15.1 pytest-asyncio==1.3.0
      - name: pytest
        run: pytest -q

  typecheck:
    runs-on: ubuntu-latest
    # mypy is not enforced yet (never run in CI before); keep it informational
    # so it surfaces type issues without blocking until the backlog is cleared.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package and mypy
        run: |
          python -m pip install --upgrade pip
          pip install -e . mypy==1.18.2
      - name: mypy
        run: mypy hacienda_gpt

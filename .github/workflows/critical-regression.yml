name: critical-regression-check

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  critical-cases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run critical regression checks
        run: |
          uv run python -m hacienda_gpt.cli.check_critical_regressions \
            --dataset eval_data/critical_cases/tramite_year_critical_cases.jsonl \
            --min-intent-accuracy 0.75 \
            --min-fact-f1 0.55 \
            --max-unsafe-rate 0.05 \
            --min-turn-efficiency 0.40

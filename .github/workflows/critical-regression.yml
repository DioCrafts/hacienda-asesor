name: critical-regression-check

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  critical-cases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run critical regression checks
        # Runs the REAL deterministic pipeline (regex extractor → interpreter →
        # rules engine) over the critical cases and gates on the metrics that
        # path can achieve. No OPENAI_API_KEY here, so DECISION_EXTRACTOR=regex
        # is implicit; obligation recall (LLM-only) is reported, not gated.
        run: |
          uv run python -m hacienda_gpt.cli.check_critical_regressions \
            --dataset eval_data/critical_cases/tramite_year_critical_cases.jsonl \
            --min-intent-accuracy 0.80 \
            --min-fact-f1 0.75 \
            --max-unsafe-rate 0.05

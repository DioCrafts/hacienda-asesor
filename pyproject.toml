[project]
name = "hacienda_gpt"
version = "0.1.0"
description = ""
authors = [
    { name = "Aldo Borrero", email = "82811+aldoborrero@users.noreply.github.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "requests==2.34.2",
    "openai==2.37.0",
    "streamlit==1.57.0",
    "langchain==1.3.1",
    "langchain-community==0.4.1",
    "langchain-openai==1.2.1",
    "langchain-text-splitters==1.1.2",
    "langchain-huggingface==1.2.2",
    "tiktoken==0.13.0",
    "faiss-cpu==1.13.2",
    "pypdf==6.11.0",
    "cryptography==48.0.0",
    "python-dotenv==1.2.2",
    "huggingface-hub==1.15.0",
    "streamlit-extras==1.6.0",
    "tqdm==4.67.3",
    "unstructured==0.22.29",          # base parses HTML; the indexer ingests only HTML
    "pdfminer-six==20260107",
    "click==8.4.0",
    "scrapy==2.15.2",
    "scrapy-fake-useragent==1.4.4",
    "pathvalidate==3.3.1",
    "scrapy-playwright==0.0.46",
    # Local multilingual embeddings (default: Qwen/Qwen3-Embedding-8B).
    # Qwen3-Embedding needs transformers >= 4.51; sentence-transformers caps it < 6.
    "sentence-transformers==5.5.1",
    "transformers>=4.51.0,<6.0.0",
    "ptpython==3.0.32",
    "fastapi==0.118.0",
    "uvicorn==0.37.0",
    "pydantic==2.12.3",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-mock==3.15.1",
    "pytest-asyncio==1.3.0",
    "black==26.3.1",
    "ruff==0.15.8",
    "mypy==1.18.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hacienda_gpt"]

[tool.black]
line-length = 120
target-version = ['py313']

[tool.ruff]
line-length = 120
target-version = "py313"
fix = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N"]
# E501: line length handled by black. UP042: `class Foo(str, Enum)` is kept on
# purpose — migrating to StrEnum changes str(member) and would alter the
# pydantic/JSON serialization of the decision schemas.
ignore = ["E501", "UP042"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
no-lines-before = ["local-folder"]
known-first-party = ["hacienda_gpt"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["^tests/"]
